
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahayak.AI: Government Scheme Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    :root {
      --glass-blur: 24px;
    }

    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      transition: background-color 0.5s ease;
    }

    .glass-panel {
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }

    /* Specular edges for glass realism */
    .glass-border {
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .dark .glass-border {
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mesh-gradient-light {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, hsla(217,100%,97%,1) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(225,100%,95%,1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(210,100%,96%,1) 0, transparent 50%);
    }

    .mesh-gradient-dark {
      background-color: #020617;
      background-image: 
        radial-gradient(at 0% 0%, hsla(222, 47%, 11%, 1) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(230, 47%, 7%, 1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(240, 47%, 5%, 1) 0, transparent 50%);
    }

    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.2);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.4);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

    "firebase/": "https://esm.sh/firebase@^12.7.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="transition-colors duration-500">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
